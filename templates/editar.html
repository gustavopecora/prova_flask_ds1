{% extends 'base.html' %}

{% block content %}
    <form class="cartao estreito" action="{{ url_for('main.editar', id=produto.id) }}" method="POST" enctype="multipart/form-data">
        <h2>Editar produto #{{ produto.id }}</h2>

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Nome do produto"
                   value="{{ form.nome if form else produto.nome }}">
            <span class="dica">Mínimo de 3 caracteres.</span>
        </div>

        <div class="campo">
            <label for="preco">Preço</label>
            <div class="preco-campo">
                <span>R$</span>
                <input type="number" step="0.01" id="preco" name="preco" placeholder="0,00"
                       value="{{ form.preco if form else produto.preco }}">
            </div>
        </div>

        <div class="campo">
            <label for="categoria_id">Categoria</label>
            <select id="categoria_id" name="categoria_id">
                <option value="">Selecione a categoria</option>
                {% set atual = form.categoria_id if form else produto.categoria_id %}
                {% for c in categorias %}
                <option value="{{ c.id }}" {{ 'selected' if atual == c.id else '' }}>{{ c.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <span class="rotulo">Foto atual</span>
            <div class="foto-atual">
                <img src="{{ url_for('static', filename='uploads/' + produto.imagem) }}" alt="Foto de {{ produto.nome }}">
            </div>
        </div>

        <div class="campo">
            <label for="foto">Trocar foto</label>
            <input type="file" id="foto" name="foto" accept=".png,.jpg,.jpeg,.gif">
            <span class="dica">Opcional. A foto antiga será removida ao salvar.</span>
        </div>

        <div class="linha-botoes">
            <button type="submit" class="botao">Salvar alterações</button>
            <a class="botao claro" href="{{ url_for('main.index') }}">Cancelar</a>
        </div>
    </form>
{% endblock %}
